{% extends "base.html" %}

{% block title %}MoviWeb App - Home{% endblock %}

{% block content %}
    <h1>MoviWeb App</h1>

    <h2>Users</h2>
    {% if users %}
    <ul>
        {% for user in users %}
        <li>
            <a href="{{ url_for('user_movies', user_id=user.id) }}">{{ user.username }}</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="no-movies">No users yet. Add your first user below!</p>
    {% endif %}

    <h2>Add New User</h2>
    <form action="{{ url_for('add_user') }}" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <button type="submit">Add User</button>
    </form>
{% endblock %}
